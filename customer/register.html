<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Customer Registration | LandHub</title><link rel="stylesheet" href="../commonui/css/style.css"><link rel="stylesheet" href="css/customer.css"><script defer src="js/register.js"></script></head><body class="customer-page"><main class="auth-shell"><section class="auth-panel"><a class="brand" href="../commonui/index.html"><span class="brand-mark">LH</span><span>LandHub</span></a><h1>Customer account</h1><p>Set up your buyer profile.</p><form id="customerRegisterForm" action="profile.html"><div id="customerMessage" role="alert"></div><div class="form-grid"><div class="field"><label for="customerName">Full name</label><input id="customerName" required></div><div class="field"><label for="customerEmail">Email</label><input id="customerEmail" type="email" required></div><div class="field"><label for="customerPassword">Password</label><input id="customerPassword" type="password" minlength="6" required></div><div class="field"><label for="customerConfirmPassword">Confirm password</label><input id="customerConfirmPassword" type="password" required></div><div class="field"><label for="customerPhone">Phone number</label><input id="customerPhone" type="tel" required></div><div class="field full"><label>Preferred location</label><input required></div><div class="field"><label>Buyer type</label><select><option>Individual</option><option>Business</option><option>Investor</option></select></div><div class="field"><label>Budget range</label><select><option>Under 10 lakh</option><option>10-50 lakh</option><option>50 lakh+</option></select></div><div class="field"><label>Preferred land use</label><select><option>Residential</option><option>Agricultural</option><option>Commercial</option></select></div><div class="field"><label>Purchase timeline</label><input type="month"></div><div class="field full"><label>Search interests</label><textarea placeholder="Road access, flood risk, utilities..."></textarea></div></div><div class="form-footer"><button class="btn" type="submit">Create account</button><a href="../commonui/login.html">Sign in</a></div></form></section><aside class="auth-aside"><div><h2>Buy land with better context.</h2><p>Save listings, compare requirements, and keep every inquiry organized.</p></div></aside></main></body></html>
