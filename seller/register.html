<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Seller Registration | LandHub</title><link rel="stylesheet" href="../commonui/css/style.css"></head><body><main class="auth-shell"><section class="auth-panel"><a class="brand" href="../commonui/index.html"><span class="brand-mark">LH</span><span>LandHub</span></a><h1>Seller account</h1><p>Prepare a verified property seller profile.</p><form action="profile.html"><div class="form-grid"><div class="field"><label>Full name</label><input required></div><div class="field"><label>Email</label><input type="email" required></div><div class="field"><label>Password</label><input type="password" minlength="6" required></div><div class="field"><label>Phone number</label><input type="tel" required></div><div class="field"><label>National ID</label><input required></div><div class="field"><label>Tax identification</label><input required></div><div class="field"><label>Company name</label><input></div><div class="field"><label>Ownership type</label><select><option>Individual owner</option><option>Co-owner</option><option>Agency</option></select></div><div class="field"><label>Primary district</label><input required></div><div class="field"><label>Estimated listing count</label><input type="number" min="1"></div><div class="field full"><label>Property documents</label><input type="file" accept=".pdf,.jpg,.png"></div></div><div class="form-footer"><button class="btn" type="submit">Create seller account</button><a href="../commonui/login.html">Sign in</a></div></form></section><aside class="auth-aside"><div><h2>Present every property with confidence.</h2><p>Manage listings, documents, availability, and buyer offers.</p></div></aside></main></body></html>
