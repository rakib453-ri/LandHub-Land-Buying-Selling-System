<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Admin Registration | LandHub</title><link rel="stylesheet" href="../commonui/css/style.css"><link rel="stylesheet" href="css/admin.css"><script defer src="js/register.js"></script></head><body class="admin-page"><main class="auth-shell"><section class="auth-panel"><a class="brand" href="../commonui/index.html"><span class="brand-mark">LH</span><span>LandHub</span></a><h1>Administrator account</h1><p>Request privileged platform access.</p><form id="adminRegisterForm" action="profile.html"><div id="adminMessage" role="alert"></div><div class="form-grid"><div class="field"><label>Full name</label><input id="adminName" required></div><div class="field"><label>Work email</label><input id="adminEmail" type="email" required></div><div class="field"><label>Password</label><input id="adminPassword" type="password" minlength="10" required></div><div class="field"><label>Confirm password</label><input id="adminConfirmPassword" type="password" required></div><div class="field"><label>Phone number</label><input id="adminPhone" type="tel" required></div><div class="field"><label>Administrator ID</label><input id="adminId" required></div><div class="field"><label>Security clearance</label><select><option>Level 1</option><option>Level 2</option><option>Level 3</option></select></div><div class="field"><label>System responsibility</label><select><option>User Governance</option><option>Compliance</option><option>Full Administration</option></select></div><div class="field"><label>Two-factor method</label><select><option>Authenticator app</option><option>SMS</option><option>Email code</option></select></div><div class="field full"><label>Approval reason</label><textarea id="approvalReason" required></textarea></div><div class="field"><label>Recovery contact</label><input type="email"></div><div class="field"><label>Access start date</label><input id="adminStartDate" type="date"></div></div><div class="form-footer"><button class="btn" type="submit">Request admin account</button><a href="../commonui/login.html">Sign in</a></div></form></section><aside class="auth-aside"><div><h2>Govern the whole marketplace.</h2><p>Control accounts, permissions, settings, audits, and system health.</p></div></aside></main></body></html>
